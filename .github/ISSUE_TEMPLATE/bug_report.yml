name: Bug report
description: Report a reproducible runtime or engine integration problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OpenGameAgent.
  - type: input
    id: version
    attributes:
      label: Source revision and runtime version
      placeholder: Git commit SHA, Node.js version, and engine version
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Godot
        - Unity
        - Unreal Engine
        - Node.js sidecar or server
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe example and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private prompts, player data, and proprietary assets.
          required: true
